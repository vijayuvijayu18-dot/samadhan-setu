{% extends "base.html" %}

{% block title %}Reset Password - SamadhanSetu{% endblock %}

{% block content %}
<div class="auth-split-wrapper">
    <div class="container">
        <div class="card shadow-lg border-0 mx-auto" style="max-width: 480px; border-radius: 12px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="kpi-icon-box bg-warning bg-opacity-10 text-warning rounded-circle mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                        <i class="fas fa-key"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Password Recovery</h4>
                    <p class="text-muted small">Enter your registered email address to receive an official access token and reset instructions.</p>
                </div>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Registered Email</label>
                        <div class="auth-input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" name="email" class="form-control" placeholder="name@institution.ac.in" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gov w-100 py-2 fw-bold mb-3">
                        Send Recovery Link
                    </button>

                    <div class="text-center">
                        <a href="{{ url_for('login') }}" class="small text-decoration-none fw-semibold">
                            <i class="fas fa-arrow-left me-1"></i> Return to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
