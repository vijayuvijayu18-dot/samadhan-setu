{% extends "base.html" %}

{% block title %}404 Not Found - SamadhanSetu{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="kpi-icon-box bg-warning bg-opacity-10 text-warning rounded-circle mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="fas fa-search-location"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404 - Page Not Found</h1>
    <p class="lead text-muted max-w-600 mx-auto mb-4">
        The challenge, project workspace, or resource you are looking for does not exist or has been moved.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('landing') }}" class="btn btn-primary-gov px-4">
            <i class="fas fa-home me-2"></i> Home
        </a>
        <a href="{{ url_for('challenges') }}" class="btn btn-outline-primary px-4">
            <i class="fas fa-bullhorn me-2"></i> Browse Challenges
        </a>
    </div>
</div>
{% endblock %}
